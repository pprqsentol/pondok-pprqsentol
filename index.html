<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aplikasi Pondok - Roudhotul Qur'an</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b5940">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="loginScreen" class="screen">
  <div class="login-box">
    <img src="icon-192.png" class="login-logo" alt="Logo Pondok">
    <h1>Aplikasi Pondok</h1>
    <p class="muted">Roudhotul Qur'an</p>
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="admin@pondok.id" onkeydown="if(event.key==='Enter') doLogin()" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:15px;box-sizing:border-box;">
    <label>Password</label>
    <div style="position:relative">
      <input id="loginPassword" type="password" onkeydown="if(event.key==='Enter') doLogin()" style="width:100%;padding:10px 40px 10px 10px;border-radius:8px;border:1px solid var(--border);font-size:15px;box-sizing:border-box;">
      <button type="button" onclick="togglePasswordView()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px" id="togglePwBtn">&#128065;</button>
    </div>
    <p id="loginError" class="muted" style="color:var(--danger);display:none;margin-top:8px"></p>
    <button class="btn-primary" id="btnMasuk" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div id="app" class="screen" style="display:none">
  <header class="topbar">
    <img src="icon-192.png" class="topbar-logo" alt="">
    <div>
      <div class="topbar-title">Aplikasi Pondok</div>
      <div class="topbar-sub" id="userLabel"></div>
    </div>
    <button class="icon-btn" onclick="logout()" title="Keluar"><i>&#8631;</i></button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>

    <main class="content" id="content"></main>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div id="modalRoot"></div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
